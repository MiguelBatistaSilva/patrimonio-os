# Configuração do Alembic (migrations).
# A URL real do banco NÃO fica aqui — é lida do .env dentro do alembic/env.py
# (a senha tem caracteres especiais que o configparser interpretaria errado).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = lida_no_env_py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
